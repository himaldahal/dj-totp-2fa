{% load i18n %}<ol class="totp-stepper" aria-label="{% trans 'Setup progress' %}" data-stepper>
  <li data-step-dot="1" class="{% if current > 1 %}is-done{% elif current == 1 %}is-current{% endif %}"{% if current == 1 %} aria-current="step"{% endif %}><span class="totp-dot">{% if current > 1 %}<svg class="totp-icon" aria-hidden="true"><use href="#i-check"/></svg>{% else %}1{% endif %}</span><span class="totp-dot-label">{% trans "Get an app" %}</span></li>
  <li data-step-dot="2" class="{% if current > 2 %}is-done{% elif current == 2 %}is-current{% endif %}"{% if current == 2 %} aria-current="step"{% endif %}><span class="totp-dot">{% if current > 2 %}<svg class="totp-icon" aria-hidden="true"><use href="#i-check"/></svg>{% else %}2{% endif %}</span><span class="totp-dot-label">{% trans "Scan" %}</span></li>
  <li data-step-dot="3" class="{% if current > 3 %}is-done{% elif current == 3 %}is-current{% endif %}"{% if current == 3 %} aria-current="step"{% endif %}><span class="totp-dot">{% if current > 3 %}<svg class="totp-icon" aria-hidden="true"><use href="#i-check"/></svg>{% else %}3{% endif %}</span><span class="totp-dot-label">{% trans "Confirm" %}</span></li>
  <li data-step-dot="4" class="{% if current == 4 %}is-current{% endif %}"{% if current == 4 %} aria-current="step"{% endif %}><span class="totp-dot">4</span><span class="totp-dot-label">{% trans "Save codes" %}</span></li>
</ol>
